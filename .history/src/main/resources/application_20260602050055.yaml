spring:
  application:
    name: repaso

  datasource:
    url: jdbc:mariadb://localhost:3306/supermarket_db
    username: root
    password: 
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true